name: ci

on:
  # branches: ['**'] matches every branch (including your own feature
  # branches) but not tags -- a bare `push:` with no filter also fires
  # on the tags changelog-release.yml creates, which would be a
  # redundant, pointless CI run on every release.
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"

      - name: Compile
        run: mvn -B compile

      - name: Style check (Google Java Style via checkstyle)
        run: mvn -B checkstyle:check

      - name: Test with 100% coverage gate (JUnit + JaCoCo)
        run: mvn -B verify

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn
